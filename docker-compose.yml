services:
  postgres:
    image: postgres:17-alpine
    container_name: mealplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealplanner}
      POSTGRES_USER: ${POSTGRES_USER:-mealplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealplanner}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - mealplanner_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealplanner} -d ${POSTGRES_DB:-mealplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mealplanner_postgres_data:
