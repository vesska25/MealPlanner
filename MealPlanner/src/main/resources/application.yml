spring:
  application:
    name: meal-planner

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:mealplanner}
    username: ${POSTGRES_USER:mealplanner}
    password: ${POSTGRES_PASSWORD:mealplanner}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-4-5

jwt:
  # Local-dev-only fallback (obviously not for production use) so `mvn test`/local runs work
  # without sourcing .env; HS256 needs at least 32 bytes. Always set JWT_SECRET for real use.
  secret: ${JWT_SECRET:dev-only-insecure-default-jwt-signing-secret-do-not-use-in-prod}
  ttl-hours: 24

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
