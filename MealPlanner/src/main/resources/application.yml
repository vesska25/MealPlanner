spring:
  application:
    name: meal-planner

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:mealplanner}
    username: ${POSTGRES_USER:mealplanner}
    password: ${POSTGRES_PASSWORD:mealplanner}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-4-5

jwt:
  # Local-dev-only fallback (obviously not for production use) so `mvn test`/local runs work
  # without sourcing .env; HS256 needs at least 32 bytes. Always set JWT_SECRET for real use.
  secret: ${JWT_SECRET:dev-only-insecure-default-jwt-signing-secret-do-not-use-in-prod}
  ttl-hours: 24

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

telegram:
  # Step 12: bot-token deliberately has NO entry here (unlike anthropic.api-key's blanket
  # ${...:} default) — every Telegram-facing bean is @ConditionalOnProperty(name =
  # "telegram.bot-token") gated, and that condition only checks whether the property is
  # ABSENT, not whether it's blank. Giving it an always-present empty-string default here would
  # make the condition true even with no token configured. Leaving it undeclared means the
  # property genuinely doesn't exist unless TELEGRAM_BOT_TOKEN is set — Spring Boot's automatic
  # relaxed environment-variable binding (SystemEnvironmentPropertySource) resolves
  # "telegram.bot-token" from that env var directly, with no application.yml entry needed.
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  internal-api-base-url: ${TELEGRAM_INTERNAL_API_BASE_URL:http://localhost:8080}
  # FR-81 gives no concrete number for either of these — 15 minutes is a production-sane
  # default that's still well within a single demo session; override low (e.g. 30000) for a
  # snappy live demo. 1-day spoilage lead time is similarly a documented judgment call, not a
  # PRD-stated number.
  notification-check-interval-ms: ${TELEGRAM_NOTIFICATION_CHECK_INTERVAL_MS:900000}
  spoilage-lead-time-days: ${TELEGRAM_SPOILAGE_LEAD_TIME_DAYS:1}
  shopping-reminder-cooldown-hours: ${TELEGRAM_SHOPPING_REMINDER_COOLDOWN_HOURS:24}
